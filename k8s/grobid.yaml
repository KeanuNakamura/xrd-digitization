apiVersion: apps/v1
kind: Deployment

metadata:
  name: grobid

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grobid

  template:
    metadata:
      labels:
        app: grobid

    spec:
      containers:
        - name: grobid
          image: grobid/grobid:0.9.0-crf

          ports:
            - containerPort: 8070

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx2g"

          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"

          readinessProbe:
            httpGet:
              path: /api/isalive
              port: 8070
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service

metadata:
  name: grobid

spec:
  selector:
    app: grobid

  ports:
    - port: 8070
      targetPort: 8070

  type: ClusterIP

