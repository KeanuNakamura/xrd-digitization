apiVersion: v1
kind: Pod
metadata:
  name: xrd-output-reader
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: alpine:3.20
      command: ["sleep", "3600"]
      volumeMounts:
        - name: xrd-output-storage
          mountPath: /data
          readOnly: true
  volumes:
    - name: xrd-output-storage
      persistentVolumeClaim:
        claimName: xrd-output
